<style>
@font-face { font-family: "Archivo"; src: url(fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "Courier Prime"; src: url(fonts/courierprime-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Courier Prime"; src: url(fonts/courierprime-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }

/* Forma: targetes 14px, botons 10px, camps sense caixa (línia de punts). */
:root {
  --cobalt: #2340a8;
  --cobalt-deep: #172d78;
  --cobalt-ink: #c9d4f7;
  --paper: #f7f8fa;
  --ground: #eef1f4;
  --ink: #14171c;
  --ink-2: #4a5160;
  --line: #cdd3dc;
  --stamp: #d4322c;
  --stamp-text: #a8231d;
  --muted: #5d6677;
  --quota: #ffd23f;
  --sans: "Archivo", system-ui, sans-serif;
  --type: "Courier Prime", "Courier New", monospace;
  --r-card: 14px;
  --r-btn: 10px;
  --max: 1180px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 88px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 18px/1.6 var(--sans); font-stretch: 100%; -webkit-font-smoothing: antialiased; }
::selection { background: var(--quota); color: var(--ink); }
:focus-visible { outline: 3px solid var(--quota); outline-offset: 3px; border-radius: 6px; }
input, textarea, select { caret-color: var(--stamp); }
html { scrollbar-color: var(--cobalt) var(--ground); }
a { color: inherit; text-underline-offset: .2em; text-decoration-thickness: 1.5px; }
h1, h2, h3 { margin: 0; font-family: var(--sans); font-weight: 800; font-stretch: 112%; letter-spacing: -.025em; line-height: 1.04; text-wrap: balance; }
h2 { font-size: clamp(34px, 4.4vw, 56px); }
p { margin: 0; text-wrap: pretty; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--paper); padding: 10px 14px; border-radius: var(--r-btn); }
.skip:focus { top: 12px; }
i.ph { font-size: 1.15em; line-height: 1; }

/* Botons */
.btn { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; font: 700 17px/1 var(--sans); font-stretch: 105%; text-decoration: none; padding: 16px 22px; border-radius: var(--r-btn); border: 2px solid transparent; cursor: pointer; transition: translate .2s var(--ease), background-color .2s, box-shadow .2s; }
.btn:hover { translate: 0 -2px; }
.btn:active { translate: 0 1px; }
.btn-quota { background: var(--quota); color: var(--ink); box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .4); }
.btn-quota:hover { background: #ffdb63; }
.btn-line { border-color: currentColor; color: inherit; background: transparent; }
.btn-cobalt { background: var(--cobalt); color: #fff; }
.btn-cobalt:hover { background: var(--cobalt-deep); }
.btn-stamp { background: var(--stamp); color: #fff; }
.btn-stamp:hover { background: #b9271f; }
.btn-sm { padding: 11px 16px; font-size: 15px; }

/* Franja demo */
.demo-bar { background: var(--ink); color: #e9ecf1; font-size: 14px; }
.demo-bar .wrap { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 16px; padding-top: 9px; padding-bottom: 9px; text-align: center; }
.demo-bar a { color: var(--quota); font-weight: 700; white-space: nowrap; }

/* Capçalera */
.top { position: sticky; top: 0; z-index: 30; background: rgba(238, 241, 244, .94); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { height: 68px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand-mark { width: 46px; height: 32px; border-radius: 6px; background: var(--cobalt); color: #fff; display: grid; place-items: center; font: 800 13px/1 var(--sans); font-stretch: 125%; letter-spacing: .04em; flex: none; position: relative; }
.brand-mark::after { content: ""; position: absolute; right: -5px; bottom: -5px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--stamp); background: var(--ground); }
.brand-name { font-weight: 700; font-stretch: 105%; font-size: 16px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30ch; }
.nav { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.nav a { text-decoration: none; font-size: 15px; font-weight: 500; color: var(--ink-2); padding: 8px 10px; border-radius: 8px; }
.nav a:hover { color: var(--ink); background: #e1e6ee; }
.lang { display: flex; margin-left: 8px; border: 1.5px solid var(--line); border-radius: var(--r-btn); overflow: hidden; }
.lang button { font: 700 13px var(--sans); border: 0; background: transparent; color: var(--ink-2); padding: 7px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.menu-btn { display: none; margin-left: auto; border: 1.5px solid var(--line); background: transparent; border-radius: var(--r-btn); padding: 8px 10px; font-size: 20px; cursor: pointer; color: var(--ink); }
@media (max-width: 1060px) {
  .menu-btn { display: inline-flex; }
  .top .cta-head { display: none; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 68px; flex-direction: column; align-items: stretch; background: var(--ground); border-bottom: 1px solid var(--line); padding: 8px 24px 20px; }
  .nav.open { display: flex; }
  .nav a { font-size: 18px; padding: 12px 6px; }
  .lang { align-self: flex-start; margin: 12px 0 0; }
}

/* Hero */
.hero { background: var(--cobalt); color: #fff; overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: 1fr 1.05fr; gap: 56px; align-items: center; padding-top: 72px; padding-bottom: 96px; min-height: min(calc(100dvh - 110px), 820px); }
.hero h1 { font-size: var(--h1, clamp(44px, 6.2vw, 84px)); margin-bottom: 24px; overflow-wrap: break-word; hyphens: auto; }
.hero h1.mid { --h1: clamp(36px, 4.4vw, 60px); }
.hero h1.long { --h1: clamp(30px, 3.2vw, 44px); }
.hero .lead { font-size: 21px; line-height: 1.5; color: var(--cobalt-ink); max-width: 30ch; margin-bottom: 34px; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 14px; }
.carnet-wrap { justify-self: center; width: min(560px, 100%); }
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; gap: 44px; padding-top: 44px; padding-bottom: 64px; min-height: 0; }
  .hero .lead { font-size: 19px; }
}

/* El carnet */
.carnet { position: relative; aspect-ratio: 1.586; background: var(--paper); color: var(--ink); border-radius: 16px; rotate: -3deg; box-shadow: 0 2px 0 rgba(255,255,255,.6) inset, 0 40px 70px -30px rgba(0, 0, 0, .45), 0 10px 22px -10px rgba(0, 0, 0, .3); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; container-type: inline-size; }
.carnet::before { content: ""; position: absolute; top: 12px; left: 50%; width: 54px; height: 9px; margin-left: -27px; border-radius: 9px; background: var(--cobalt); box-shadow: inset 0 2px 3px rgba(0,0,0,.35); z-index: 2; }
.c-band { background: var(--cobalt-deep); color: #fff; display: flex; justify-content: space-between; align-items: end; padding: 30px 6cqw 12px; }
.c-band b { font-weight: 800; font-stretch: 125%; font-size: max(11px, 2.5cqw); letter-spacing: .16em; }
.c-band span { font-family: var(--type); font-size: max(12px, 2.7cqw); color: var(--quota); }
.c-body { display: grid; grid-template-columns: 24cqw 1fr; gap: 5cqw; padding: 4.5cqw 6cqw 0; }
.c-photo { aspect-ratio: 3 / 4; border: 2px dashed #9aa3b2; border-radius: 6px; display: grid; place-items: center; color: var(--muted); font-size: max(10px, 2.2cqw); text-align: center; line-height: 1.2; }
.c-photo i { display: block; font-size: 7cqw; margin-bottom: 4px; }
.c-fields { display: grid; gap: 2.2cqw; align-content: start; min-width: 0; }
.c-field small { display: block; font-size: max(9px, 1.9cqw); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.c-field .v { display: block; font-family: var(--type); font-size: max(12px, 3cqw); border-bottom: 1.5px dotted var(--muted); padding-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-field .v.org { font-family: var(--sans); font-weight: 800; font-stretch: 108%; font-size: max(13px, 3.6cqw); letter-spacing: -.01em; white-space: normal; line-height: 1.12; border: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.c-quota { display: flex; align-items: center; gap: 2cqw; padding: 3.6cqw 6cqw 4.5cqw; }
.c-quota small { font-size: max(9px, 1.9cqw); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: 1cqw; }
.c-box { width: 10cqw; height: 7cqw; border: 1.5px solid #9aa3b2; border-radius: 3px; display: grid; place-items: center; font-family: var(--type); font-size: max(9px, 2cqw); color: var(--muted); position: relative; }
.c-box.paid::after { content: attr(data-paid); position: absolute; inset: -3px; background: var(--quota); color: var(--ink); font: 700 max(8px, 1.8cqw)/1 var(--sans); font-stretch: 112%; letter-spacing: .06em; display: grid; place-items: center; border-radius: 2px; rotate: -4deg; box-shadow: 0 2px 4px rgba(0,0,0,.18); }
@media (max-width: 600px) { .carnet { aspect-ratio: auto; } }
.stamp { position: absolute; right: -3cqw; bottom: 1cqw; width: 31cqw; aspect-ratio: 1; color: var(--stamp); mix-blend-mode: multiply; rotate: -14deg; opacity: .9; pointer-events: none; }
.stamp svg { width: 100%; height: 100%; display: block; overflow: visible; -webkit-mask-image: url(img/ink.png); mask-image: url(img/ink.png); -webkit-mask-size: 160px; mask-size: 160px; }
.stamp text { font-family: var(--sans); font-weight: 800; fill: currentColor; }

/* Moment de càrrega: el carnet arriba i el segell cau una vegada */
@media (prefers-reduced-motion: no-preference) {
  .carnet { animation: deal .9s var(--ease) both; }
  .carnet .stamp { animation: press .55s var(--ease) .75s both; }
  .carnet.thud { animation: deal .9s var(--ease) both, thud .22s ease-out 1.05s; }
}
@keyframes deal { from { translate: 0 40px; rotate: 4deg; opacity: 0; } to { translate: 0 0; rotate: -3deg; opacity: 1; } }
@keyframes press { 0% { scale: 1.9; opacity: 0; filter: blur(8px); } 70% { scale: .96; opacity: .95; filter: blur(0); } 100% { scale: 1; opacity: .9; } }
@keyframes thud { 0% { translate: 0 0; } 40% { translate: 0 3px; } 100% { translate: 0 0; } }

/* Seccions */
.sec { padding: 112px 0; }
.sec-head { max-width: 62ch; margin-bottom: 48px; }
.sec-head p { margin-top: 16px; font-size: 19px; color: var(--ink-2); }
@media (max-width: 760px) { .sec { padding: 76px 0; } .sec-head { margin-bottom: 36px; } }

.demo-note { display: flex; gap: 10px; align-items: flex-start; border: 1.5px dashed #a7b0be; border-radius: var(--r-card); padding: 12px 16px; font-size: 15px; color: var(--ink-2); max-width: 62ch; }
.demo-note i { margin-top: 3px; color: var(--cobalt); }

/* Qui som */
.about { display: grid; grid-template-columns: 1.1fr .9fr; gap: 64px; align-items: start; }
.about h2 { margin-bottom: 26px; }
.about .text p { font-size: 20px; color: var(--ink-2); max-width: 52ch; }
.about .text p + p { margin-top: 18px; }
.about .demo-note { margin-top: 28px; }
.fitxa { background: var(--paper); border-radius: var(--r-card); padding: 34px 34px 30px; rotate: 1.2deg; box-shadow: 0 30px 50px -34px rgba(20, 30, 70, .55), 0 6px 14px -8px rgba(20, 30, 70, .25); }
.fitxa h3 { font: 700 19px/1.3 var(--type); color: var(--ink); letter-spacing: 0; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 2px solid #e7a6a3; }
.fitxa ol { list-style: none; margin: 0; padding: 0; counter-reset: v; }
.fitxa li { counter-increment: v; display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 8px 0 14px; }
.fitxa li::before { content: counter(v) "."; font-family: var(--type); font-weight: 700; color: var(--stamp-text); font-size: 20px; line-height: 1.5; }
.fitxa b { display: block; font-size: 21px; font-weight: 800; font-stretch: 108%; }
.fitxa span { display: block; font-family: var(--type); font-size: 16px; color: var(--ink-2); line-height: 1.55; }
@media (max-width: 900px) { .about { grid-template-columns: 1fr; gap: 44px; } .fitxa { rotate: 0deg; } }

/* Agenda: tiquets */
.agenda { background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.now { display: flex; align-items: center; gap: 12px; font-family: var(--type); font-size: 16px; color: var(--ink-2); margin-bottom: 22px; }
.now::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--stamp); box-shadow: 0 0 0 5px rgba(212, 50, 44, .16); }
.now::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--stamp), var(--line) 40%); }
.tickets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.ticket { display: grid; grid-template-rows: auto 1fr; background: var(--ground); border-radius: var(--r-card); overflow: hidden; position: relative; box-shadow: 0 1px 0 var(--line); }
.t-stub { background: var(--cobalt); color: #fff; padding: 18px 20px 20px; display: flex; align-items: baseline; gap: 10px; position: relative; }
.t-stub .d { font-size: 54px; font-weight: 800; font-stretch: 112%; line-height: .9; }
.t-stub .m { font-weight: 700; font-stretch: 112%; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; }
.t-meta .in { font-family: var(--type); color: var(--stamp-text); }
.t-stub::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; border-bottom: 2px dashed var(--ground); }
.ticket::before, .ticket::after { content: ""; position: absolute; top: calc(var(--stub, 92px) - 9px); width: 18px; height: 18px; border-radius: 50%; background: var(--paper); z-index: 1; }
.ticket::before { left: -9px; } .ticket::after { right: -9px; }
.t-body { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.t-body h3 { font-size: 21px; font-stretch: 104%; letter-spacing: -.01em; line-height: 1.18; }
.t-meta { display: grid; gap: 4px; font-size: 15px; color: var(--ink-2); }
.t-meta span { display: flex; align-items: center; gap: 8px; }
.t-body .btn { margin-top: auto; align-self: flex-start; }
.ticket:first-child .t-stub { background: var(--stamp); }
@media (max-width: 1000px) {
  .tickets { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(260px, 78%); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 14px; margin: 0 -24px; padding-left: 24px; padding-right: 24px; scroll-padding: 24px; }
  .ticket { scroll-snap-align: start; }
}

/* Participa: cupons apilats */
.join { background: var(--cobalt); color: #fff; }
.join-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 64px; align-items: start; }
.join-intro { position: sticky; top: 120px; }
.join-intro h2 { margin-bottom: 20px; }
.join-intro p { color: var(--cobalt-ink); font-size: 19px; max-width: 34ch; }
.stack { display: grid; gap: 0; padding-bottom: 60px; }
.coupon { position: sticky; top: calc(110px + var(--i) * 30px); margin-bottom: clamp(120px, 18vh, 190px); background: var(--paper); color: var(--ink); border-radius: var(--r-card); display: grid; grid-template-columns: 112px 1fr; overflow: hidden; rotate: var(--rot); box-shadow: 0 30px 60px -28px rgba(0, 0, 0, .45), 0 8px 18px -10px rgba(0, 0, 0, .3); }
.coupon:last-child { margin-bottom: 0; }
.cp-stub { background: var(--tint); display: grid; place-items: center; position: relative; border-right: 2px dashed rgba(20, 23, 28, .25); }
.cp-stub i { font-size: 46px; color: var(--ink); }
.cp-body { padding: 28px 30px 30px; }
.cp-body h3 { font-size: 30px; margin-bottom: 10px; }
.cp-body p { color: var(--ink-2); font-size: 17px; margin-bottom: 22px; max-width: 40ch; }
@media (max-width: 900px) {
  .join-grid { grid-template-columns: 1fr; gap: 40px; }
  .join-intro { position: static; }
  .coupon { top: calc(84px + var(--i) * 18px); grid-template-columns: 76px 1fr; margin-bottom: clamp(90px, 12vh, 130px); rotate: 0deg; }
  .cp-stub i { font-size: 34px; }
  .cp-body { padding: 22px 20px 24px; }
  .cp-body h3 { font-size: 25px; }
}

/* Butlleta d'inscripció */
.butlleta-sec { background: var(--cobalt); padding: 0 0 112px; }
.butlleta { position: relative; background: var(--paper); border-radius: var(--r-card); padding: 48px 52px 44px; max-width: 900px; margin: 0 auto; box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .5); }
.butlleta h2 { font-size: clamp(30px, 3.4vw, 42px); margin-bottom: 10px; }
.butlleta > p { color: var(--ink-2); margin-bottom: 30px; max-width: 56ch; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 36px; }
.form .full { grid-column: 1 / -1; }
.field label { display: block; font-size: 14px; font-weight: 700; letter-spacing: .02em; color: var(--ink-2); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; font: 400 19px/1.4 var(--type); color: var(--ink); background: transparent; border: 0; border-bottom: 2px dotted #7d8697; border-radius: 0; padding: 6px 2px 8px; }
.field textarea { min-height: 90px; resize: vertical; background-image: repeating-linear-gradient(transparent 0 33px, #d6dce6 33px 34px); line-height: 34px; padding-top: 0; }
.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 14px) 55%, calc(100% - 8px) 55%; background-size: 6px 6px; background-repeat: no-repeat; cursor: pointer; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-bottom: 2px solid var(--cobalt); background-color: rgba(35, 64, 168, .05); }
.field [aria-invalid="true"] { border-bottom-color: var(--stamp); }
.field .err { display: none; color: #a8231d; font-size: 14px; margin-top: 6px; }
.field [aria-invalid="true"] + .err { display: block; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--ink-2); }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--cobalt); flex: none; }
.form-foot { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.form-msg { font-size: 15px; color: var(--ink-2); max-width: 46ch; }
.form-msg.bad { color: #a8231d; }
.butlleta .stamp { right: 40px; top: 30px; bottom: auto; width: 150px; opacity: 0; }
.butlleta.sent .stamp { opacity: .9; }
@media (prefers-reduced-motion: no-preference) { .butlleta.sent .stamp { animation: press .5s var(--ease) both; } }
@media (max-width: 760px) {
  .butlleta { padding: 30px 22px 28px; }
  .form { grid-template-columns: 1fr; gap: 22px; }
  .butlleta .stamp { width: 110px; right: 14px; top: 14px; }
  .butlleta-sec { padding-bottom: 76px; }
}

/* Notícies */
.news { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; }
.n-feat { background: var(--cobalt-deep); color: #fff; border-radius: var(--r-card); padding: 40px; display: flex; flex-direction: column; justify-content: space-between; min-height: 380px; position: relative; overflow: hidden; }
.n-feat .big { font-size: clamp(90px, 11vw, 150px); font-weight: 800; font-stretch: 125%; line-height: .8; color: var(--quota); letter-spacing: -.04em; }
.n-feat time { font-family: var(--type); color: var(--cobalt-ink); font-size: 16px; }
.n-feat h3 { font-size: clamp(26px, 2.6vw, 34px); margin: 10px 0 12px; }
.n-feat p { color: var(--cobalt-ink); max-width: 44ch; }
.n-list { display: grid; align-content: start; }
.n-item { padding: 26px 0; border-bottom: 1.5px solid var(--line); }
.n-item:first-child { padding-top: 6px; }

footer { background: var(--ink); color: #b7bdc8; font-size: 14px; padding: 26px 0 34px; }

  }

const params = new URLSearchParams(location.search);
function cleanName(raw) {
  if (!raw) return "";
  const n = raw.replace(/\s+/g, " ").trim().replace(/[^\p{L}\p{N} .,'’()·&\-]/gu, "");
  return n.length >= 2 ? n.slice(0, 90) : "";
}
const custom = cleanName(params.get("entidad") || params.get("entitat") || "");
let lang = (params.get("lang") || "").toLowerCase() === "es" ? "es" : "ca";

function initials(name) {
  const skip = new Set(["de", "del", "la", "el", "les", "els", "los", "las", "i", "y", "d", "l", "a", "per", "para", "associació", "associacio", "asociación", "asociacion", "entitat", "entidad"]);
  let w = name.replace(/['’]/g, " ").split(/[\s\-.,()·]+/).filter(x => x && !skip.has(x.toLowerCase()));
  if (!w.length) w = name.split(/\s+/);
  return w.slice(0, 2).map(x => x[0]).join("").toUpperCase();
}
const loc = () => (lang === "es" ? "es-ES" : "ca-ES");
const fmt = (d, o) => new Intl.DateTimeFormat(loc(), o).format(d);
function addDays(n) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d; }

function render() {
  const L = I18N[lang];
  const name = custom || L.defaultName;
  const sub = (s) => s.replace(/\{nom\}/g, name);
  document.documentElement.lang = lang;
  document.title = name + " | " + L.titleSuffix;
  document.querySelectorAll("[data-name]").forEach(el => { el.textContent = name; });
  document.querySelectorAll("[data-t]").forEach(el => { const v = L[el.dataset.t]; if (typeof v === "string") el.textContent = sub(v); });
  document.getElementById("demoText").textContent = custom ? sub(L.demoFor) : L.demoGeneric;
  const ini = initials(name);
  document.getElementById("mark").textContent = ini;
  document.querySelectorAll(".initials").forEach(t => { t.textContent = ini; t.setAttribute("font-size", ini.length > 2 ? 36 : 46); });
  const h1 = document.getElementById("h1");
  h1.classList.toggle("mid", name.length > 22 && name.length <= 42);
  h1.classList.toggle("long", name.length > 42);
  document.getElementById("carnetLabel").textContent = sub(L.cardLabel);

  const today = addDays(0), y = today.getFullYear();
  
  document.getElementById("cardDate").textContent = fmt(today, { day: "2-digit", month: "2-digit", year: "numeric" });
  const q = ["q1", "q2", "q3", "q4"].map(id => document.getElementById(id));
  q.forEach((b, i) => { b.textContent = y + i; });
  q[0].dataset.paid = L.paid;
  document.getElementById("year").textContent = y;
  document.getElementById("docYear").textContent = L.docYear.replace("{any}", y - 1);
  document.getElementById("now").textContent = L.today.replace("{data}", fmt(today, { weekday: "long", day: "numeric", month: "long" }));

  const t = document.getElementById("tickets"); t.innerHTML = "";
  [5, 10, 16, 31].forEach((n, i) => {
    const d = addDays(n), [title, place, hour] = L.events[i];
    const a = document.createElement("article"); a.className = "ticket";
    a.innerHTML = '<div class="t-stub"><span class="d"></span><span class="m"></span></div>' +
      '<div class="t-body"><h3></h3><div class="t-meta"><span class="in"><i class="ph ph-calendar-blank" aria-hidden="true"></i><b style="font-weight:400" class="ind"></b></span><span><i class="ph ph-clock" aria-hidden="true"></i><b style="font-weight:400" class="h"></b></span><span><i class="ph ph-map-pin" aria-hidden="true"></i><b style="font-weight:400" class="p"></b></span></div>' +
      '<a class="btn btn-line btn-sm" href="#butlleta"></a></div>';
    a.querySelector(".d").textContent = d.getDate();
    a.querySelector(".m").textContent = fmt(d, { month: "short" }).replace(".", "");
    a.querySelector(".ind").textContent = L.inDays.replace("{n}", n);
    a.querySelector("h3").textContent = title;
    a.querySelector(".h").textContent = fmt(d, { weekday: "long" }) + ", " + hour;
    a.querySelector(".p").textContent = place;
    a.querySelector("a").textContent = L.signUp;
    t.appendChild(a);
  });
  requestAnimationFrame(() => {
    const stub = t.querySelector(".t-stub");
    if (stub) t.querySelectorAll(".ticket").forEach(k => k.style.setProperty("--stub", stub.offsetHeight + "px"));
  });

  const dates = [addDays(-4), addDays(-15), addDays(-31)];
  const f = document.getElementById("nFeat");
  f.querySelector(".big").textContent = dates[0].getDate();
  f.querySelector("time").textContent = fmt(dates[0], { month: "long", year: "numeric" });
  f.querySelector("time").setAttribute("datetime", dates[0].toISOString().slice(0, 10));
  f.querySelector("h3").textContent = L.news[0][0];
  f.querySelector("p").textContent = L.news[0][1];
  const list = document.getElementById("nList"); list.innerHTML = "";
  [1, 2].forEach(i => {
    const a = document.createElement("article"); a.className = "n-item";
    a.innerHTML = "<time></time><h3></h3><p></p>";
    a.querySelector("time").textContent = fmt(dates[i], { day: "numeric", month: "long", year: "numeric" });
    a.querySelector("time").setAttribute("datetime", dates[i].toISOString().slice(0, 10));
    a.querySelector("h3").textContent = L.news[i][0];
    a.querySelector("p").textContent = L.news[i][1];
    list.appendChild(a);
  });
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  document.querySelectorAll(".lang button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  const p = new URLSearchParams(location.search); p.set("lang", lang);
  history.replaceState(null, "", location.pathname + "?" + p.toString() + location.hash);
  resetForm(false);
  render();
}));
document.querySelectorAll(".lang button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));

const menuBtn = document.getElementById("menuBtn"), nav = document.getElementById("nav");
menuBtn.addEventListener("click", () => { const o = nav.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", String(o)); });
nav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }));
document.querySelectorAll("[data-choice]").forEach(a => a.addEventListener("click", () => { document.getElementById("f-type").value = a.dataset.choice; }));

const form = document.getElementById("form"), msg = document.getElementById("formMsg"), card = document.getElementById("butlleta");
function resetForm(clear) {
  card.classList.remove("sent"); msg.textContent = ""; msg.classList.remove("bad");
  form.querySelectorAll("[aria-invalid]").forEach(x => x.removeAttribute("aria-invalid"));
  if (clear) form.reset();
}
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const L = I18N[lang];
  const name = form.elements.name, mail = form.elements.email, ok = document.getElementById("f-ok");
  const nOk = name.value.trim().length > 1, mOk = /^\S+@\S+\.\S+$/.test(mail.value.trim());
  name.setAttribute("aria-invalid", String(!nOk)); mail.setAttribute("aria-invalid", String(!mOk));
  card.classList.remove("sent");
  if (!nOk || !mOk || !ok.checked) {
    msg.textContent = !ok.checked && nOk && mOk ? L.eConsent : (!ok.checked ? L.eConsent : "");
    msg.classList.toggle("bad", !!msg.textContent);
    (!nOk ? name : !mOk ? mail : ok).focus();
    return;
  }
  void card.offsetWidth;
  card.classList.add("sent");
  msg.classList.remove("bad");
  msg.textContent = L.fOk;
  form.reset();
  form.querySelectorAll("[aria-invalid]").forEach(x => x.removeAttribute("aria-invalid"));
});

render();
const carnet = document.getElementById("carnet");
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) carnet.classList.add("thud");
</script>
